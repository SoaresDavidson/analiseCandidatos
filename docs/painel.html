<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Politicagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap">
<style>
/* Visual inspirado no site de resultados do TSE: faixa amarela, cabeçalho branco com abas
   sublinhadas, cartões de pergunta como os cartões de eleição. Cada pergunta abre numa
   página própria, com a resposta primeiro. */
:root {
  color-scheme: light;
  --fundo: #f4f4f4; --branco: #ffffff; --texto: #333333; --texto-2: #6b6b6b; --linha: #e6e4df;
  --ouro: #ebb400; --ouro-esc: #8f6c00; --verde-esc: #5e7a12; --breve: #9a9a9a;
  --fonte: "Open Sans", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--fundo); color: var(--texto); font: 15px/1.5 var(--fonte); display: flex; flex-direction: column; }
a { color: inherit; }
.faixa { flex: none; background: var(--ouro); color: #fff; font-size: 12.5px; font-weight: 700; display: flex; justify-content: flex-end; align-items: center; gap: 12px; padding: calc(4px + env(safe-area-inset-top, 0px)) 20px 4px; flex-wrap: wrap; }
.faixa button { border: 0; background: transparent; color: #fff; font: 700 12.5px var(--fonte); cursor: pointer; padding: 2px 4px; }
.faixa button:hover { text-decoration: underline; }
/* a aba do jogo, na faixa ao lado dos nomes do grupo */
.faixa .jogo { background: #fff; color: var(--texto); text-decoration: none; padding: 2px 11px; border-radius: 999px; font-weight: 800; }
.faixa .jogo:hover, .faixa .jogo[aria-current="page"] { background: var(--verde-esc); color: #fff; }
.cab { flex: none; background: var(--branco); box-shadow: 0 2px 8px rgb(0 0 0 / .06); position: relative; z-index: 2; }
.cab-in { max-width: 1160px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; gap: 10px 28px; min-height: 62px; flex-wrap: wrap; }
.marca { display: grid; line-height: 1; text-decoration: none; }
.marca b { font-size: 11.5px; font-weight: 800; letter-spacing: .02em; }
.marca span { font-size: 21px; font-weight: 800; color: var(--ouro); }
.marca small { font-size: 9px; font-weight: 700; color: var(--texto-2); margin-top: 2px; }
.nav { display: flex; gap: 4px 24px; margin-left: auto; flex-wrap: wrap; }
.nav a { text-decoration: none; font-weight: 600; font-size: 14.5px; padding: 19px 0 15px; border-bottom: 4px solid transparent; }
.nav a[aria-current="page"] { border-color: var(--ouro); }
.nav a:hover { border-color: #f5dc8a; }
.nav a:focus-visible, .cartao:focus-visible, .faixa button:focus-visible { outline: 3px solid var(--ouro); outline-offset: 2px; }
.palco { flex: 1; min-height: 0; }
iframe { border: 0; width: 100%; height: 100%; display: block; background: var(--fundo); }
.inicio { height: 100%; overflow-y: auto; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 26px 20px 56px; display: grid; gap: 16px; }
h1 { font-size: clamp(24px, 3.2vw, 30px); font-weight: 800; margin: 0; line-height: 1.2; }
.lead { margin: 0; color: var(--texto-2); max-width: 72ch; }
.cartoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.cartao { display: grid; grid-template-columns: 76px minmax(0, 1fr); background: var(--branco); border-radius: 6px; overflow: hidden; text-decoration: none; min-height: 118px; box-shadow: 0 1px 2px rgb(0 0 0 / .06); }
a.cartao:hover { box-shadow: 0 0 0 2px var(--ouro); }
.cartao .lado { background: var(--ouro); color: #fff; display: grid; place-items: center; align-content: center; gap: 2px; font-weight: 800; }
.cartao .lado small { font-size: 11px; font-weight: 700; }
.cartao .lado b { font-size: 24px; line-height: 1; }
.cartao.breve .lado { background: var(--breve); }
.cartao.destaque { grid-template-columns: 92px minmax(0, 1fr); min-height: 96px; }
.cartao.destaque .lado { background: var(--verde-esc); }
.cartao.destaque .lado b { font-size: 20px; }
.cartao .corpo { padding: 12px 14px; display: grid; gap: 2px; align-content: center; }
.cartao .tema { font-size: 13px; color: var(--texto-2); }
.cartao .perg { font-weight: 700; font-size: 15.5px; line-height: 1.3; }
.cartao .resp { font-size: 13.5px; margin-top: 4px; }
.cartao .resp b { color: var(--ouro-esc); font-weight: 800; }
.cartao.breve .perg { color: var(--texto-2); }
/* animações básicas: ao abrir, ao trocar de página, e o aviso do segredo */
@media (prefers-reduced-motion: no-preference) {
  .faixa, .cab { animation: desce .5s cubic-bezier(.2, .8, .3, 1) both; }
  .cab { animation-delay: .08s; }
  .temas .sub-in a { animation: sobe .35s ease both; }
  .inicio h1, .inicio .lead { animation: sobe .55s cubic-bezier(.2, .8, .3, 1) both; }
  .inicio .lead { animation-delay: .08s; }
  .bloco-tema h2 { animation: sobe .5s ease both; }
  .cartao { animation: sobe .5s cubic-bezier(.2, .8, .3, 1) both; animation-delay: calc(.12s + var(--i, 0) * .05s); }
  a.cartao { transition: transform .2s ease, box-shadow .2s ease; }
  a.cartao:hover { transform: translateY(-3px); }
  .palco iframe { transition: opacity .35s ease, transform .35s ease; }
  .palco iframe.entrando { opacity: 0; transform: translateY(10px); }
}
@keyframes desce { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
@keyframes sobe { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.segredo { position: fixed; z-index: 60; left: 50%; top: 40%; transform: translate(-50%, -50%); background: #1b222b; color: #ffd86b; font-weight: 800; font-size: 26px; padding: 18px 30px; border-radius: 16px; box-shadow: 0 0 0 4px #ffd86b, 0 20px 60px rgb(0 0 0 / .5); display: flex; gap: 12px; align-items: center; animation: segredo 1.8s ease both; }
.segredo span { font-size: 38px; }
@keyframes segredo { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 25%, 80% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%) scale(.95); } }
/* as perguntas de um tema: botões como os de cargo no site do TSE */
.temas { flex: none; background: var(--branco); border-top: 1px solid var(--linha); }
.temas[hidden] { display: none; }
.temas .sub-in { max-width: 1160px; margin: 0 auto; padding: 8px 20px; display: flex; gap: 8px; flex-wrap: wrap; }
.temas a { text-decoration: none; border: 2px solid var(--verde-esc); color: var(--verde-esc); border-radius: 6px; padding: 5px 14px; font-weight: 700; font-size: 13.5px; display: inline-flex; gap: 8px; align-items: center; }
.temas a small { background: var(--verde-esc); color: #fff; border-radius: 4px; padding: 0 6px; font-size: 11.5px; }
.temas a[aria-current="page"] { background: var(--verde-esc); color: #fff; }
.temas a[aria-current="page"] small { background: #fff; color: var(--verde-esc); }
.temas a:hover:not([aria-current="page"]) { background: #eef4d8; }
.temas a:focus-visible { outline: 3px solid var(--ouro); outline-offset: 2px; }
.bloco-tema { display: grid; gap: 10px; }
.bloco-tema h2 { font-size: 20px; margin: 10px 0 0; border-left: 5px solid var(--ouro); padding-left: 10px; }
.bloco-tema h2 a { text-decoration: none; }
.bloco-tema h2 a:hover { text-decoration: underline; }
.sobre { position: fixed; inset: 0; z-index: 50; }
.sobre iframe { width: 100%; height: 100%; border: 0; background: transparent; }
.aviso { font-size: 13px; color: var(--texto-2); max-width: 90ch; margin: 0; }
</style>
</head>
<body>
<div class="faixa"><span>Banco de Dados Relacionais · UFPI</span><span aria-hidden="true">|</span><span>Davi, Duda, Eduardo e Enrico</span><a class="jogo" id="aba-arena" href="#arena" aria-current="false">⚔ Arena</a><span aria-hidden="true">|</span><button type="button" id="ant" aria-label="Pergunta anterior">‹ anterior</button><button type="button" id="prox" aria-label="Próxima pergunta">próxima ›</button><button type="button" id="tela">Tela cheia</button></div>
<header class="cab"><div class="cab-in">
  <a class="marca" href="#inicio"><b>ELEIÇÕES</b><span>POLITICAGEM</span><small>AM · GO · MA · MT · RS · SE</small></a>
  <nav class="nav" id="abas" aria-label="Temas"></nav>
</div></header>
<nav class="temas" id="sub" aria-label="Perguntas do tema" hidden></nav>
<main class="palco" id="palco"></main>
<!-- a ficha de um eleito abre por cima da aba atual; ao fechar, a aba continua onde estava -->
<div class="sobre" id="sobre" hidden><iframe id="sobre-quadro" title="Ficha do eleito"></iframe></div>

<script>
(function () {
  "use strict";
  // ------------------------------------------------------------------
  // NAVEGAÇÃO POR TEMA: poucas abas no topo; dentro de cada tema, as perguntas
  // viram botões (como "PRESIDENTE | GOVERNADOR | ..." no site do TSE).
  // PARA COLOCAR UMA PERGUNTA NOVA: gere a página dela em docs/<pasta>/index.html,
  // acrescente uma linha em `paginas` do tema certo e marque `aba` no cartão dela em
  // CARTOES. A frase do cartão resume os números da página: atualize junto.
  // ------------------------------------------------------------------
  const TEMAS = [
    { id: "cidades", nome: "Cidades", paginas: [
      { id: "q7", n: 7, nome: "Para que lado vota", pagina: "q7-painel/index.html" },
      { id: "q3", n: 3, nome: "Riqueza × quem vence", pagina: "q3-painel/index.html" },
      { id: "q4", n: 4, nome: "Escolaridade", pagina: "q4-painel/index.html" },
      { id: "q6", n: 6, nome: "Idade e alternância", pagina: "q6-painel/index.html" },
      { id: "municipios", nome: "Explorar municípios", pagina: "municipios-painel/index.html" },
    ] },
    { id: "dinheiro", nome: "Dinheiro", paginas: [
      { id: "q8", n: 8, nome: "Fundo público", pagina: "q8-painel/index.html" },
      { id: "q9", n: 9, nome: "Propaganda", pagina: "q9-painel/index.html" },
      { id: "q2", n: 2, nome: "Patrimônio", pagina: "q2-painel/index.html" },
    ] },
    { id: "politicos", nome: "Políticos", paginas: [
      { id: "q10", n: 10, nome: "Carreira", pagina: "q10-painel/index.html" },
      { id: "candidatos", nome: "Quem são os eleitos", pagina: "candidatos-painel/index.html" },
      { id: "plenarios", nome: "Plenários", pagina: "plenarios-painel/index.html" },
    ] },
  ];
  // números conferidos no banco (6 estados): Q4, Q8, Q9 e Q10 em 15/10/2026; Q3 e Q7 em 17/10/2026; Q2 e Q6 em 20/10/2026
  const CARTOES = [
    { n: 7, tema: "cidades", aba: "q7", assunto: "Viés político", perg: "Para que lado as cidades foram?", resp: "Para a direita: de 2020 a 2024, <b>66%</b> das cidades votaram mais à direita para vereador, mesmo com a régua fixa." },
    { n: 3, tema: "cidades", aba: "q3", assunto: "Índices da cidade", perg: "A cidade mais rica vota diferente?", resp: "Quase não: ricas ou pobres, elegem os mesmos partidos. <b>59%</b> das prefeituras ficaram com União, MDB e PP." },
    { n: 4, tema: "cidades", aba: "q4", assunto: "Escolaridade", perg: "Quem estuda mais se elege mais?", resp: "Só <b>15%</b> dos adultos têm faculdade; entre os eleitos de 2024, <b>37%</b>." },
    { n: 6, tema: "cidades", aba: "q6", assunto: "Idade", perg: "Jovem vota em jovem? A cidade troca de comando?", resp: "Jovem não vota em jovem: só <b>5,5%</b> dos votos para vereador em 2024 foram para candidatos de até 29 anos. E <b>60%</b> das cidades trocaram o partido do prefeito." },
    { n: 8, tema: "dinheiro", aba: "q8", assunto: "Dinheiro público", perg: "Depender do fundo público ajuda a vencer?", resp: "Em geral, não: vereadores de 2024 que dependem dele se elegem <b>14%</b> das vezes; os outros, <b>20%</b>." },
    { n: 9, tema: "dinheiro", aba: "q9", assunto: "Propaganda", perg: "Onde o candidato gasta com propaganda?", resp: "Nas eleições de 2024, <b>65%</b> foi para papel impresso e campanha de rua. Internet: 7%." },
    { n: 1, tema: "dinheiro", assunto: "Custo da campanha", perg: "Quanto custa uma cadeira?" },
    { n: 2, tema: "dinheiro", aba: "q2", assunto: "Patrimônio", perg: "Quem é mais rico se elege mais?", resp: "Sim: entre os candidatos a vereador em 2024, <b>27%</b> do quinto mais rico se elegeram; do mais pobre, <b>12%</b>." },
    { n: 10, tema: "politicos", aba: "q10", assunto: "Carreira", perg: "Quanto dura a carreira de um político?", resp: "De cada 100 vereadores novatos, só <b>27</b> seguem eleitos 8 anos depois." },
    { n: 5, tema: "politicos", assunto: "Voto de legenda", perg: "Quantos se elegem graças ao voto no partido?" },
  ];
  const DESTAQUES = {
    cidades: `<a class="cartao destaque" href="#municipios"><span class="lado"><small>Cidades</small><b>1.239</b></span><span class="corpo"><span class="tema">Explorar municípios</span><span class="perg">Tudo sobre cada cidade</span><span class="resp">A régua do espectro, a câmara eleita cadeira por cadeira, o dinheiro das campanhas e os eleitos com foto.</span></span></a>`,
    politicos: `<a class="cartao destaque" href="#candidatos"><span class="lado"><small>Fichas</small><b>14 mil</b></span><span class="corpo"><span class="tema">Quem são os eleitos</span><span class="perg">A ficha de cada eleito</span><span class="resp">Os <b>14.194</b> eleitos de 2022 e 2024 nos 6 estados, com foto, votos, patrimônio, campanha e carreira.</span></span></a>`,
  };

  const PAGINAS = TEMAS.flatMap(t => t.paginas.map(p => ({ ...p, tema: t })));
  const acharPagina = id => PAGINAS.find(p => p.id === id);
  // páginas fora das abas: só por link ou pelo segredo (código Konami ou 5 cliques no logo)
  const ESCONDIDAS = [{ id: "arena", nome: "Arena", pagina: "arena-painel/index.html" }];
  const abas = document.getElementById("abas"), sub = document.getElementById("sub"), palco = document.getElementById("palco");
  const links = [{ id: "inicio", nome: "Início" }, ...TEMAS].map(a => { const l = document.createElement("a"); l.href = "#" + a.id; l.textContent = a.nome; abas.appendChild(l); return [a.id, l]; });
  const pagina = p => (window.urlPagina ? window.urlPagina(p) : p);  // no arquivo único, as páginas vêm embutidas

  function inicio() {
    let ordemCartao = 0;
    const cartao = c => c.aba
      ? `<a class="cartao" style="--i:${ordemCartao++}" href="#${c.aba}"><span class="lado"><small>Pergunta</small><b>${c.n}</b></span><span class="corpo"><span class="tema">${c.assunto}</span><span class="perg">${c.perg}</span><span class="resp">${c.resp}</span></span></a>`
      : `<div class="cartao breve" style="--i:${ordemCartao++}"><span class="lado"><small>Em breve</small><b>${c.n}</b></span><span class="corpo"><span class="tema">${c.assunto}</span><span class="perg">${c.perg}</span></span></div>`;
    palco.innerHTML = `<div class="inicio"><div class="wrap">
      <h1>O que os dados das eleições respondem</h1>
      <p class="lead">Candidaturas e resultados do TSE e dados do IBGE, de 2002 a 2024, nos seis estados sorteados. Escolha uma pergunta: cada uma abre com a resposta em linguagem simples e um gráfico. Os detalhes técnicos ficam no fim de cada página.</p>
      ${TEMAS.map(t => `<section class="bloco-tema"><h2><a href="#${t.id}">${t.nome}</a></h2>${DESTAQUES[t.id] || ""}<div class="cartoes">${CARTOES.filter(c => c.tema === t.id).sort((a, b) => !!b.aba - !!a.aba).map(cartao).join("")}</div></section>`).join("")}
      <p class="aviso">Os gráficos mostram o que anda junto, não o que causa. Toda comparação de chance de vitória é feita dentro do mesmo cargo.</p>
    </div></div>`;
  }

  function abrir() {
    // #q7, #municipios/2111300 (cidade), #municipios/MA (estado), #candidatos/2024-123 (ficha) ou #cidades (1ª página do tema)
    const [id, extra] = (location.hash || "#inicio").slice(1).split("/");
    const escondida = ESCONDIDAS.find(x => x.id === id);
    document.getElementById("aba-arena").setAttribute("aria-current", escondida ? "page" : "false");
    if (escondida) {
      for (const [, l] of links) l.setAttribute("aria-current", "false");
      sub.hidden = true; palco.innerHTML = "";
      const f = document.createElement("iframe"); f.src = pagina(escondida.pagina); f.title = escondida.nome; preparar(f); palco.appendChild(f);
      return;
    }
    const tema = TEMAS.find(t => t.id === id), p = tema ? { ...tema.paginas[0], tema } : acharPagina(id);
    for (const [k, l] of links) l.setAttribute("aria-current", k === (p ? p.tema.id : "inicio") ? "page" : "false");
    sub.hidden = !p;
    if (!p) { inicio(); return; }
    sub.innerHTML = `<div class="sub-in">${p.tema.paginas.map(q => `<a href="#${q.id}" aria-current="${q.id === p.id ? "page" : "false"}">${q.n ? `<small>${q.n}</small>` : ""}${q.nome}</a>`).join("")}</div>`;
    palco.innerHTML = "";
    const alvo = !extra ? "" : p.id === "municipios" ? (/^\d+$/.test(extra) ? "#cod=" : "#uf=") + extra : "#c=" + extra;
    const f = document.createElement("iframe"); f.src = pagina(p.pagina) + alvo; f.title = p.nome;
    preparar(f);
    palco.appendChild(f);
  }
  const ordem = ["inicio", ...PAGINAS.map(p => p.id)];
  const passo = d => { const atual = (location.hash || "#inicio").slice(1).split("/")[0], t = TEMAS.find(x => x.id === atual), i = ordem.indexOf(t ? t.paginas[0].id : atual); location.hash = "#" + ordem[(Math.max(0, i) + d + ordem.length) % ordem.length]; };
  document.getElementById("ant").addEventListener("click", () => passo(-1));
  document.getElementById("prox").addEventListener("click", () => passo(1));
  const digitando = e => e.target && e.target.closest && e.target.closest("input, select, textarea");
  document.addEventListener("keydown", e => { if (digitando(e)) return; if (tecla(e.key)) return; if (e.key === "ArrowRight") passo(1); if (e.key === "ArrowLeft") passo(-1); });

  // ---------- o segredo: código Konami (↑↑↓↓←→←→BA) ou 5 cliques no logo abrem a Arena ----------
  const KONAMI = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown", "ArrowLeft", "ArrowRight", "ArrowLeft", "ArrowRight", "b", "a"];
  let progresso = 0;
  function tecla(k) {   // devolve true enquanto o código está em andamento (as setas não trocam de página)
    k = k.length === 1 ? k.toLowerCase() : k;
    progresso = k === KONAMI[progresso] ? progresso + 1 : (k === KONAMI[0] ? 1 : 0);
    if (progresso === KONAMI.length) { progresso = 0; desbloquear(); return true; }
    return progresso > 4;
  }
  let cliques = [];
  document.querySelector(".marca").addEventListener("click", () => { const t = Date.now(); cliques = cliques.filter(x => t - x < 3000).concat(t); if (cliques.length >= 5) { cliques = []; desbloquear(); } });
  function desbloquear() {
    const aviso = document.createElement("div"); aviso.className = "segredo"; aviso.innerHTML = "<span>⚡</span>Arena desbloqueada!";
    document.body.appendChild(aviso); setTimeout(() => aviso.remove(), 1800);
    setTimeout(() => { location.hash = "#arena"; }, 500);
  }

  // ---------- animações das páginas: cada página entra suave e os blocos sobem em sequência ----------
  const ANIMA = `@media (prefers-reduced-motion: no-preference) { main > * { animation: sobePag .5s cubic-bezier(.2,.8,.3,1) both; } ${Array.from({ length: 12 }, (_, i) => `main > :nth-child(${i + 1}) { animation-delay: ${(i * 0.06).toFixed(2)}s; }`).join(" ")} @keyframes sobePag { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } } }`;
  function preparar(f) {
    f.classList.add("entrando");
    f.addEventListener("load", () => {
      f.classList.remove("entrando");
      try {   // mesma origem (site local): injeta a animação e repassa as teclas para o segredo funcionar dentro da página
        const doc = f.contentDocument, st = doc.createElement("style"); st.textContent = ANIMA; doc.head.appendChild(st);
        doc.addEventListener("keydown", e => { if (!digitando(e)) tecla(e.key); });
      } catch (err) { /* arquivo aberto sem servidor: segue sem animação */ }
    });
  }
  document.getElementById("tela").addEventListener("click", () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); } catch (e) { /* o navegador não deixa */ } });
  window.addEventListener("hashchange", abrir);
  // pedidos das páginas: abrir a ficha de um eleito por cima (Q4, Municípios) ou ir para uma cidade (Q3, Q7)
  const sobre = document.getElementById("sobre"), quadro = document.getElementById("sobre-quadro");
  window.addEventListener("message", ev => {
    const m = ev.data;
    if (m && m.tipo === "abrir-candidato" && m.ano && m.sq) {
      // a página de Candidatos em modo ficha (so=1); trocar só o # não recarrega, ela abre a ficha nova
      quadro.src = pagina("candidatos-painel/index.html") + `#c=${m.ano}-${m.sq}&so=1&n=${Date.now()}`;  // n: o mesmo eleito duas vezes ainda troca o #
      sobre.hidden = false;
    }
    if (m && m.tipo === "fechar-ficha") sobre.hidden = true;
    if (m && m.tipo === "abrir-municipio" && m.cod) location.hash = `#municipios/${m.cod}`;
  });
  abrir();
})();
</script>
