[project]
name = "analisecandidatos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.16.3",
    "duckdb>=1.5.5",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "pandas>=3.0.5",
    "pymupdf>=1.28.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "sqlfluff>=4.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# o formatador cuida do comprimento; o que sobra são strings longas (SQL), sem quebra boa
ignore = ["E501"]

[tool.sqlfluff.core]
dialect = "duckdb"
max_line_length = 120
# SELECT * e * EXCLUDE são intencionais na carga: as colunas vêm do leiaute do TSE
exclude_rules = "AM04"

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.literals]
capitalisation_policy = "upper" # NULL, TRUE, FALSE

[tool.sqlfluff.rules.capitalisation.functions]
extended_capitalisation_policy = "lower"
