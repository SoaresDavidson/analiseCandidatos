name: ruff

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # instala o ruff na versão travada no uv.lock e já roda o lint
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
      - run: ruff format --check --diff
